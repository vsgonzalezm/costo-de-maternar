  function logoImage(source, className, alt) {
    var image = document.createElement('img');
    image.className = className;
    image.alt = alt;
    image.src = source;
    return image;
  }

  var coverLogos = document.createElement('div');
  coverLogos.className = 'cover-logos';
  coverLogos.appendChild(logoImage(projectSource, 'project-logo', 'Project logo'));
  coverLogos.appendChild(logoImage(anidSource, 'anid-logo', 'ANID logo'));
  titleSlide.appendChild(coverLogos);

  var author = titleSlide.querySelector('.author');
  if (author && !titleSlide.querySelector('.coauthor-line')) {
    var coauthors = document.createElement('div');
    coauthors.className = 'coauthor-line';
    coauthors.textContent = 'Co-authors: Tania Hutt and Isidora Jeria';
    author.insertAdjacentElement('afterend', coauthors);
  }

  var persistent = document.createElement('div');
  persistent.className = 'persistent-logos';
  persistent.appendChild(logoImage(projectSource, 'project-logo', 'Project logo'));
  persistent.appendChild(logoImage(anidSource, 'anid-logo', 'ANID logo'));
  document.querySelector('.reveal').appendChild(persistent);

  function updatePersistentLogos() {
    var current = typeof Reveal !== 'undefined' ? Reveal.getCurrentSlide() : null;
    persistent.classList.toggle('is-hidden', current === titleSlide);
  }

  updatePersistentLogos();
  if (typeof Reveal !== 'undefined') Reveal.on('slidechanged', updatePersistentLogos);
});
</script>
